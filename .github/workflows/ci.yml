name: CI

on:
  pull_request:
  push:
    branches: [main, integration/main-product]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # No model and no API key in CI: the tests must pass without either.
      ASSISTANT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Fast tests (everything except slow)
        run: pytest -m "not slow"
      - name: All tests with coverage summary
        run: |
          pytest --cov=app --cov-report=term | tee coverage.txt
          { echo '### Backend coverage'; echo '```'; sed -n '/coverage:/,$p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Benefits Assistant</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="util"><div class="wrap"><a href="#">Help</a><a href="#">Sign in</a></div></div>
<header class="nav"><div class="wrap">
  <a class="brand" href="/"><span class="mark"></span><span>Benefits Portal<small>HACKATHON PROTOTYPE</small></span></a>
  <nav class="links"><a href="/#plans">Plans</a><a href="/#family">Family</a><a href="/#calculator">Calculator</a><a class="on" href="assistant.html">AI Assistant</a></nav>
  <a class="btn outline" href="/">Back to benefits</a>
</div></header>

<div class="wrap chat-shell">
  <aside class="side">
    <div class="card" id="who"></div>
    <div class="card"><h4>Try asking</h4><div class="sugg" id="sugg"></div></div>
  </aside>
  <main class="chat">
    <div class="chat-head"><span>Benefits Assistant</span><small>Not medical or legal advice</small></div>
    <div class="msgs" id="msgs"></div>
    <div id="pillBox"></div>
    <form class="compose" id="form">
      <label class="attach">Attach PDF<input id="file" type="file" accept="application/pdf" hidden></label>
      <input id="input" type="text" placeholder="Ask about your plan, family, or a report..." autocomplete="off">
      <button class="btn orange" type="submit">Send</button>
    </form>
  </main>
</div>
<script src="chat.js"></script>
</body>
</html>

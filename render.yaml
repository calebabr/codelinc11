# Render blueprint for the backend API.
# In Render: New > Blueprint > point at this repo. Render reads this file,
# creates the service and the persistent disk, then asks you to fill in the
# values marked sync:false below. Nothing here provisions anything until YOU
# create the blueprint in your Render account.
services:
  - type: web
    name: dental-benefits-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Persistent disk so the SQLite demo database survives restarts.
    disk:
      name: benefits-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BENEFITS_DB_PATH
        value: /data/benefits.db
      # Chat provider: "anthropic" uses the key below; "none" disables chat but
      # keeps the rest of the app working.
      - key: ASSISTANT_PROVIDER
        value: anthropic
      # Set in the Render dashboard (secret). Required only if ASSISTANT_PROVIDER=anthropic.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Comma-separated list of allowed frontend origins (your Vercel URL).
      # e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Stable signing secret for demo sessions (any long random string).
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"

# Netlify config for the frontend (the live frontend; see docs/DEPLOYMENT.md).
# It lives at the repo root so Netlify finds it with no dashboard setup: connect the
# repo and deploy. The backend runs elsewhere (AWS today; render.yaml is an unused alternative).
#
# Set this in Netlify (Site configuration > Environment variables). It is read at build
# time, so redeploy ("Clear cache and deploy") after changing it:
#   VITE_API_URL = /api
# The browser then calls https://<this site>/api/..., and Netlify forwards it to the AWS
# backend (the /api/* rule below). Same origin and HTTPS, so there is no mixed-content
# block and no CORS. The backend must set TRUST_PROXY=1 so its per-visitor rate limits
# read the visitor's address from X-Forwarded-For instead of seeing only Netlify's.
# There is no sign-in service: visitors use "Try the demo".

[build]
  base = "frontend"          # the app's package.json is in frontend/
  command = "npm run build"  # Netlify installs packages from package-lock.json first
  publish = "dist"           # relative to base: frontend/dist

[build.environment]
  NODE_VERSION = "20"        # same as CI

# API: forward /api/* to the backend on AWS (Elastic IP, so it survives restarts).
# Must stay above the single-page-app rule. Netlify gives up on a forwarded request
# after about 26 seconds, so very slow assistant answers can time out.
[[redirects]]
  from = "/api/*"
  to = "http://3.149.89.171:8000/:splat"
  status = 200
  force = true

# Single-page app: every route (/plans, /login/factor-one ...) serves index.html.
# Real files such as /assets/*.js are served first, so this only catches app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built assets have a content hash in their names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify config (alternative to Vercel). Set the base to this folder in the
# Netlify UI, or deploy from the repo root with: netlify deploy --dir frontend/dist
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# SPA fallback so client routes (e.g. /app/chatbot) work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_API_URL and VITE_CLERK_PUBLISHABLE_KEY in the Netlify dashboard
# (Site settings > Environment variables) — they are build-time vars.

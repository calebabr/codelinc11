[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    unit: pure logic (engine, data, search, parsers); no HTTP, no database
    api: goes through the FastAPI app with TestClient
    contract: API shapes and golden numbers the frontend depends on
    regression: one test per bug that was fixed (tests/test_regressions.py)
    agent: the AI assistant (tools, guards, loop) with a scripted fake model
    db: touches the SQLite database layer or sandboxes
    slow: takes more than 3 seconds
    feature(name): the feature a test covers, for example feature("F5")
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
